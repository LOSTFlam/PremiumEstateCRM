name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Lint client code
        run: |
          cd client
          npm run lint || echo "Linting not configured"
        continue-on-error: true

      - name: Lint server code
        run: |
          cd server
          npm run lint || echo "Linting not configured"
        continue-on-error: true

      - name: Test client build
        run: |
          cd client
          npm run build || echo "Build not configured"
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Run npm audit (client)
        run: |
          cd client
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Run npm audit (server)
        run: |
          cd server
          npm audit --audit-level=moderate || true
        continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          echo "Checking for sensitive files..."
          ! find . -name ".env" -not -path "*/node_modules/*" | grep -v ".env.example" | grep -q .
        continue-on-error: false

      - name: Check package.json consistency
        run: |
          echo "Checking package.json files..."
          test -f package.json
          test -f client/package.json
          test -f server/package.json

  labeler:
    name: Auto Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Label PR based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  notify:
    name: Notify on PR
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-audit, code-quality]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ needs.lint-and-test.result }}' === 'success';
            const message = success
              ? '✅ All checks passed! Thank you for your contribution.'
              : '⚠️ Some checks failed. Please review the logs above.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${message}\n\nOur team will review your PR soon. Thank you for your patience! 🚀`
            });
