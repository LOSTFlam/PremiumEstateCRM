name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Build client
        run: |
          cd client
          npm run build
        continue-on-error: true

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## Changes in this release
            
            ### Features
            - 
            
            ### Bug Fixes
            - 
            
            ### Improvements
            - 
            
            ### Documentation
            - 
            
            ---
            
            **Full Changelog**: https://github.com/LOSTFlam/PremiumEstateCRM/compare/${{ github.event.before }}...${{ github.ref }}

      - name: Upload Client Build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./client/build.zip
          asset_name: client-build-${{ github.ref_name }}.zip
          asset_content_type: application/zip
        continue-on-error: true

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Create release announcement
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Release ${context.ref.replace('refs/tags/', '')}`,
              body: `
            ## 🎉 New Release Available!
            
            ### Installation
            
            \`\`\`bash
            git clone https://github.com/LOSTFlam/PremiumEstateCRM.git
            cd PremiumEstateCRM
            npm run install-all
            npm run dev
            \`\`\`
            
            ### What's Changed
            
            See the full changelog for details.
            
            ---
            
            **Thank you to all contributors!** ❤️
            `,
              draft: false,
              prerelease: false
            });
