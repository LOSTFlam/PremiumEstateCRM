<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D076"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
    <linearGradient id="iconDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d141f"/>
    </linearGradient>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#iconDark)"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="196" height="196" rx="38" stroke="url(#iconGold)" stroke-width="3"/>
  <rect x="10" y="10" width="180" height="180" rx="30" stroke="rgba(212,175,55,0.15)" stroke-width="1"/>
  
  <!-- House icon -->
  <g transform="translate(20, 30)" filter="url(#iconGlow)">
    <!-- Main house outline -->
    <path d="M80 20 L140 60 L140 140 L20 140 L20 60 Z" 
          fill="none" 
          stroke="url(#iconGold)" 
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Base -->
    <path d="M20 140 L140 140" 
          stroke="url(#iconGold)" 
          stroke-width="4"
          stroke-linecap="round"/>
    
    <!-- Floor dividers -->
    <path d="M55 85 L55 140" 
          stroke="url(#iconGold)" 
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.6"/>
    <path d="M105 85 L105 140" 
          stroke="url(#iconGold)" 
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.6"/>
    
    <!-- Window/door hints -->
    <rect x="70" y="95" width="20" height="25" 
          stroke="url(#iconGold)" 
          stroke-width="2"
          opacity="0.5"
          rx="2"/>
    
    <!-- Peak accent -->
    <path d="M80 20 L85 28 L80 36 L75 28 Z" 
          fill="url(#iconGold)"/>
  </g>
  
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="3" fill="url(#iconGold)" opacity="0.7"/>
  <circle cx="170" cy="30" r="3" fill="url(#iconGold)" opacity="0.7"/>
  <circle cx="30" cy="170" r="3" fill="url(#iconGold)" opacity="0.7"/>
  <circle cx="170" cy="170" r="3" fill="url(#iconGold)" opacity="0.7"/>
</svg>
