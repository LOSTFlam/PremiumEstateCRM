<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D076"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962E"/>
    </linearGradient>
    <linearGradient id="logoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d141f"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon mark -->
  <g transform="translate(10, 20)">
    <circle cx="60" cy="60" r="58" fill="url(#logoDark)" stroke="url(#logoGold)" stroke-width="2.5"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="1"/>
    <g filter="url(#logoGlow)">
      <path d="M60 28 L88 48 L88 88 L32 88 L32 48 Z" 
            fill="none" 
            stroke="url(#logoGold)" 
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M32 88 L88 88" 
            stroke="url(#logoGold)" 
            stroke-width="3"
            stroke-linecap="round"/>
      <path d="M52 58 L52 88" 
            stroke="url(#logoGold)" 
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.7"/>
      <path d="M68 58 L68 88" 
            stroke="url(#logoGold)" 
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.7"/>
      <path d="M60 28 L63 32 L60 36 L57 32 Z" 
            fill="url(#logoGold)"/>
    </g>
    <circle cx="38" cy="38" r="2" fill="url(#logoGold)" opacity="0.6"/>
    <circle cx="82" cy="38" r="2" fill="url(#logoGold)" opacity="0.6"/>
    <circle cx="38" cy="82" r="2" fill="url(#logoGold)" opacity="0.6"/>
    <circle cx="82" cy="82" r="2" fill="url(#logoGold)" opacity="0.6"/>
  </g>
  
  <!-- Brand name text -->
  <g transform="translate(155, 50)">
    <!-- PREMIUM -->
    <text x="0" y="45" 
          fill="#FFFFFF" 
          font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
          font-size="52" 
          font-weight="700"
          letter-spacing="8"
          style="text-transform: uppercase;">
      PREMIUM
    </text>
    
    <!-- ESTATE -->
    <text x="0" y="95" 
          fill="url(#logoGold)" 
          font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="28" 
          font-weight="600"
          letter-spacing="14"
          style="text-transform: uppercase;">
      ESTATE
    </text>
    
    <!-- Decorative line -->
    <line x1="0" y1="115" x2="380" y2="115" 
          stroke="url(#logoGold)" 
          stroke-width="1.5"
          opacity="0.5"/>
    
    <!-- Tagline -->
    <text x="0" y="138" 
          fill="#8F9BAF" 
          font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-size="11" 
          font-weight="500"
          letter-spacing="3">
      CURATED ESTATES • PRIVATE BROKERAGE
    </text>
  </g>
</svg>
